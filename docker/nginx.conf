worker_processes auto;
pid /tmp/trafirdis-nginx.pid;
# Nginx error messages can include original request URLs, including media tokens.
# Deliberately disable request/error logging; startup validation still uses stderr.
error_log /dev/null;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    # Nginx initializes module temp directories even for static-only hosting.
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        absolute_redirect off;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            default_type text/plain;
            return 200 "healthy\n";
        }
        location = /runtime-config.js {
            alias /tmp/trafirdis-runtime.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }
        location = /plex { return 404; }
        location ^~ /plex/ { return 404; }
        location ~ /\. { return 404; }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
