services:
  trafirdis:
    build:
      context: .
      args:
        VITE_SECTION_ORDER: ${VITE_SECTION_ORDER:-Recently Added,Continue Watching,Unwatched Movies}
    image: trafirdis:local
    ports:
      - "${TRAFIRDIS_BIND_IP:-127.0.0.1}:${TRAFIRDIS_PORT:-8080}:8080"
    environment:
      TRAFIRDIS_DIAGNOSTICS: ${TRAFIRDIS_DIAGNOSTICS:-false}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
